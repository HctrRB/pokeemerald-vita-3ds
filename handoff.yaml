performance_sesion_27:   # logs/sesion 27, 60 FPS, 3D
  - Frame mean / p95 / p99: 7.5 / 14.3 / 19.7 ms; >16.7 ms 1.65 %, >33.3 ms 0.01 % (was 12.7 % and
    0.83 % before the work). No visible holes; chunk builds on Core 2, Core 0 waits gone.
  - GBA menus and the battle HUD have since been replaced by the native touch UI in
    src/platform/ui/ (~0.8 ms Core 0 / ~0.3 ms Core 1 in session 31, down from 5-18 ms in Pass 6).

vita3k:
  - Vita3K (A:\juegos\Vita3k, v0.2.1) boots the game with the Vulkan backend but shows a black
    screen (vitaGL output not presented); the OpenGL backend crashes the emulator. Visual checks
    and performance numbers are taken on hardware.

open_issues:
  - Secondary screens still falling back to GBA (Pass 6): post-catch Pokedex entry over 3D battle,
    summary opened from a PC box (sBoxCursorArea), Move Relearner / Deleter, Contest / Battle
    Frontier party choice, Battle Pyramid bag in battle and its "bag full: toss" step, and Easy
    Chat Bard song / quiz variants. Link / recorded battles, Wally's catching tutorial and Battle
    Arena judgment intentionally keep the GBA HUD. Walda's FRIENDS wallpaper ignores tile frames.
  - Chunk worker shares Core 2 with DrawWorker1/2: overlay scanlines 3.5 -> 5 ms on average when
    running together. Fix if needed: lower VoxelChunkWorker priority below DrawWorker1/2 (docs/THREADS.md).
  - Long mountain chunks cost 15-35 ms on Core 2; lighting is most of it (E5b pending).
  - Map crossing frame still costs 10-20 ms when an atlas slot has to be composed from scratch
    (ComposeAtlasSlot is not spread over frames; extensions are).
  - Entity snapshot double buffer can be overwritten while Core 0 reads it at 30 FPS (docs/THREADS.md).
  - Long-session CDRAM stability (>30 min play) still needs hardware verification after raising
    vitaGL pools to 40 MB RAM / 88 MB CDRAM (aecb746) to stop chunk VBO fragmentation; also monitor
    intermittent stalls caused by synchronous memory card writes (ui_stall.c, 120-frame perf_frames.csv flush).
  - Faulty voxel terrain and black relief-mesh holes on routes and caves catalogued in
    docs/plan/LISTA_TERRENO_RUTAS_CUEVAS.md (Route 119 long bridge, Lilycove and Mirage Island fixed locally).

