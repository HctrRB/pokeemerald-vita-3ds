<!-- Top Left Location HUD Pill -->

<!-- DIALOGUE REGION: Nameplate + Main Frame + Vita Controller Hints -->
<div class="absolute bottom-[16px] left-[32px] right-[32px] flex flex-col pointer-events-auto">
<!-- Speaker Badge / Nameplate -->
<div class="relative z-10 self-start -mb-[2px] ml-4"><div class="flex items-center gap-2.5 bg-deep-teal-ink px-4 py-1.5 rounded-t-xl shadow-md border-t-2 border-l-2 border-r-2 border-primary-container"><span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span><span class="material-symbols-outlined text-[13px] text-primary">call</span><span class="font-headline-sm text-warm-cream tracking-wider uppercase font-bold drop-shadow-[0_1px_1px_rgba(0,0,0,0.8)]" style="font-family: &quot;Press Start 2P&quot;, monospace; font-size: 11px; line-height: 14px; letter-spacing: 0.06em;">POKÉNAV • MR. STONE</span><span class="text-[8px] text-primary font-bold px-1.5 py-0.5 bg-slate-black/60 rounded border border-primary/30 tracking-wider ml-1" style="font-family: &quot;Press Start 2P&quot;, monospace;">DEVON CORP</span></div></div>
<!-- Main Retro-Modern Parchment Dialogue Box -->
<div class="relative w-full h-[126px] bg-warm-cream rounded-xl p-[5px] shadow-2xl overflow-hidden ring-4 ring-deep-teal-ink ring-offset-0">
<!-- Inner Emerald Border Layer (Tactile Double Inset) -->
<div class="w-full h-full bg-[#FCFDF9] rounded-lg p-4 flex flex-col justify-between relative shadow-[inset_0_2px_4px_rgba(28,40,38,0.12),inset_0_-2px_0_rgba(88,146,126,0.3)]"><div class="flex flex-col justify-between h-full pl-3 pr-10 py-1"><div class="flex items-start justify-between"><div class="space-y-2 mt-1"><p class="text-deep-teal-ink font-bold tracking-wide select-none leading-relaxed" id="dialogue-line-1" style="font-family: &quot;Press Start 2P&quot;, monospace; font-size: 11px; line-height: 18px; letter-spacing: 0.04em;">BRENDAN! How are you holding up? It's MR. STONE from DEVON CORP.</p></div><div class="flex items-center gap-2 select-none -mt-1"><style>@keyframes pokenav-pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.3;transform:scale(0.85);}}@keyframes pokenav-wave{0%{transform:scale(0.4);opacity:0.9;}100%{transform:scale(1.8);opacity:0;}}@keyframes pokenav-hud-glow{0%,100%{box-shadow:0 0 4px rgba(88,146,126,0.4);}50%{box-shadow:0 0 10px rgba(151,211,188,0.7);}}@keyframes antenna-blink{0%,100%{background-color:#38ef7d;box-shadow:0 0 6px #38ef7d;}50%{background-color:#0d472a;box-shadow:none;}}</style><div class="relative flex flex-col items-center"><div class="w-1.5 h-3 bg-[#24433D] rounded-t-sm flex items-start justify-center relative"><div class="w-2 h-2 rounded-full absolute -top-1.5 animate-[antenna-blink_1.2s_infinite]"></div></div><div class="w-[58px] h-[48px] bg-[#163832] rounded-[6px] border-2 border-[#58927E] p-1 flex flex-col justify-between shadow-[0_2px_8px_rgba(0,0,0,0.5)] relative animate-[pokenav-hud-glow_3s_ease-in-out_infinite]"><div class="flex items-center justify-between px-0.5"><div class="flex items-center gap-0.5"><span class="w-1.5 h-1.5 rounded-full bg-[#38ef7d] animate-pulse"></span><span class="w-1 h-1 rounded-full bg-[#f4a261]"></span></div><span class="text-[6px] font-bold tracking-tighter text-[#97D3BC]" style="font-family: &quot;Press Start 2P&quot;, monospace;">NAV</span></div><div class="relative w-full h-[24px] bg-[#0c1f1b] rounded-sm border border-[#2e6856] flex items-center justify-center overflow-hidden"><div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(56,239,125,0.15)_0%,transparent_70%)]"></div><span class="absolute w-6 h-6 rounded-full border border-[#38ef7d]/40 animate-[pokenav-wave_2s_linear_infinite]"></span><span class="absolute w-6 h-6 rounded-full border border-[#38ef7d]/20 animate-[pokenav-wave_2s_linear_infinite_1s]"></span><div class="w-2 h-2 rounded-full bg-[#38ef7d] animate-[pokenav-pulse_1s_infinite] shadow-[0_0_5px_#38ef7d] z-10"></div><div class="absolute left-1 bottom-0.5 text-[5px] text-[#97D3BC]/80 leading-none" style="font-family: &quot;Press Start 2P&quot;, monospace;">RX</div></div><div class="flex items-center justify-between px-1"><div class="w-2 h-2 bg-[#081b18] rounded-full border border-[#58927E] flex items-center justify-center"><div class="w-1 h-1 bg-[#38ef7d] rounded-full"></div></div><div class="flex gap-0.5"><span class="w-1.5 h-1.5 bg-[#407a68] rounded-full"></span><span class="w-1.5 h-1.5 bg-[#d9534f] rounded-full"></span></div></div></div></div></div></div><div class="flex items-center justify-between pt-1 border-t border-emerald-sage/20"><div class="flex items-center gap-3"></div></div></div><div class="absolute bottom-3 right-4 flex items-center justify-center"><div class="w-6 h-6 rounded-full bg-deep-teal-ink flex items-center justify-center shadow-md animate-bounce"><span class="material-symbols-outlined text-[16px] text-mint-glow -mb-0.5" style="font-variation-settings: &quot;FILL&quot; 1;">arrow_drop_down</span></div></div></div>

<!-- Sony PlayStation Vita Controls Bar -->
<div class="mt-2 flex items-center px-3 text-mint-glow font-label-md text-label-md justify-end"><div class="flex items-center gap-2.5 text-mint-glow font-label-md"><div class="flex items-center gap-1.5 bg-deep-teal-ink/90 hover:bg-deep-teal-ink px-2.5 py-1 rounded-full shadow-sm cursor-pointer transition-colors" id="btn-advance"><span class="w-4 h-4 rounded-full bg-primary text-on-primary text-[10px] font-bold flex items-center justify-center shadow-inner">✕</span><span class="font-semibold tracking-wider text-warm-cream" style="font-family: &quot;Press Start 2P&quot;, monospace; font-size: 8.5px; line-height: 12px;">ADVANCE</span></div></div></div>
</div>

<script>
    // Handheld clock simulation & interactive advance micro-state
    (function () {
      const clockEl = document.getElementById('vita-clock');
      function updateClock() {
        const now = new Date();
        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        if (clockEl) clockEl.textContent = hours + ':' + minutes + ' ' + ampm;
      }
      updateClock();
      setInterval(updateClock, 30000);

      // Micro dialog toggle simulation on advance
      const advanceBtn = document.getElementById('btn-advance');
      const l1 = document.getElementById('dialogue-line-1');
      const l2 = document.getElementById('dialogue-line-2');
      let step = 0;

      const dialogues = [
        {
          l1: "BRENDAN! Before you go, say hi to",
          l2: "PROF. BIRCH next door."
        },
        {
          l1: "He was looking for you earlier.",
          l2: "Take care out in the tall grass!"
        }
      ];

      if (advanceBtn && l1 && l2) {
        advanceBtn.addEventListener('click', function () {
          step = (step + 1) % dialogues.length;
          l1.textContent = dialogues[step].l1;
          l2.innerHTML = dialogues[step].l2 + ' <span class="inline-block w-2.5 h-4 bg-emerald-sage/60 animate-pulse ml-1 align-middle rounded-xs"></span>';
        });
      }

      // Auto button feedback
      const autoBtn = document.getElementById('btn-auto');
      let autoActive = false;
      if (autoBtn) {
        autoBtn.addEventListener('click', function () {
          autoActive = !autoActive;
          autoBtn.classList.toggle('bg-emerald-sage', autoActive);
          autoBtn.classList.toggle('text-on-primary', autoActive);
        });
      }
    })();
  </script>
