<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ficha de entrenador</title>
<link rel="stylesheet" href="../_shared/ui.css">
<style>
  .card { width: 440px; flex: none; display: grid; grid-template-columns: 144px 1fr; gap: 12px 16px; align-content: start; }
  .pic { width: 144px; height: 144px; background: var(--paper-1); display: flex; align-items: center; justify-content: center; }
  .kv { display: flex; justify-content: space-between; height: 32px; align-items: center; border-bottom: 2px solid var(--paper-1); }
  .wide { grid-column: 1 / 3; }
  .badges { flex: 1; display: flex; flex-direction: column; gap: 12px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .b { height: 88px; background: var(--paper-1); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: var(--t-body-sm); }
  .b img { zoom: 3; }
  .b.off img { opacity: 0.18; filter: grayscale(1); }
  .b.on { outline: 3px solid var(--select); outline-offset: -3px; }
  .info { font-size: var(--t-body-sm); line-height: 30px; }
</style>
</head>
<body data-screen="ficha">
<!-- Only data the game has (G9): name, ID, money, Pokédex, play time, badges, Battle Points. -->
<div class="stage">
  <div class="frame">
    <div class="header" data-nav="card:front">
      <span class="spacer"></span>
      <span class="capsule">IDNo. 24891</span>
    </div>
    <div class="body">
      <div class="panel card">
        <div class="pic"><img class="x2" src="../_assets/trainers/brendan.png" alt=""></div>
        <div>
          <div class="ps">BRENDAN</div>
          <div class="kv" style="margin-top:12px"><span>MONEY</span><span class="money">₽ 3,000</span></div>
          <div class="kv"><span>POKéDEX</span><span>14</span></div>
          <div class="kv"><span>TIME</span><span>12:47</span></div>
        </div>
        <div class="wide">
          <div class="kv"><span>BATTLE POINTS</span><span>0 BP</span></div>
          <div class="kv"><span>HALL OF FAME</span><span>-</span></div>
        </div>
      </div>
      <div class="panel badges">
        <div class="panel-head"><span class="ps">BADGES</span><span class="spacer"></span><span>4 / 8</span></div>
        <div class="grid">
          <div class="b"><img src="../_assets/badges/badge_1.png" alt="">STONE</div>
          <div class="b"><img src="../_assets/badges/badge_2.png" alt="">KNUCKLE</div>
          <div class="b"><img src="../_assets/badges/badge_3.png" alt="">DYNAMO</div>
          <div class="b on"><img src="../_assets/badges/badge_4.png" alt="">HEAT</div>
          <div class="b off"><img src="../_assets/badges/badge_5.png" alt="">-</div>
          <div class="b off"><img src="../_assets/badges/badge_6.png" alt="">-</div>
          <div class="b off"><img src="../_assets/badges/badge_7.png" alt="">-</div>
          <div class="b off"><img src="../_assets/badges/badge_8.png" alt="">-</div>
        </div>
        <div class="info">HEAT BADGE · LAVARIDGE GYM · Leader FLANNERY<br>Obtained after the battle at LAVARIDGE TOWN.</div>
      </div>
    </div>
    <div class="footer">
      <span class="btn" data-btn="cross"><span class="glyph cross">✕</span>Flip card</span>
      <span class="btn" data-btn="circle"><span class="glyph circle">○</span>Back</span>
      <span class="spacer"></span>
      <span class="btn">◀▶ Badge</span>
    </div>
  </div>
</div>
<script src="../_shared/data.js"></script>
<script src="../_shared/nav.js"></script>
<script src="../_shared/screens.js"></script>
</body>
</html>
