<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pokémon Emerald Gen 3 × PS Vita UI Mockups (960×544 Unified System)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=block" rel="stylesheet">
<style>
  :root {
    /* Canonical Gen 3 GBA Tokens */
    --gba-charcoal: #293131;
    --gba-outline: #141A1C;
    --gba-mint: #73CDA4;
    --gba-emerald: #209C08;
    --gba-msg-mint: #18E878;
    --gba-msg-teal: #00A888;
    --gba-paper: #FFFFFF;
    --gba-ivory: #FAF8F0;
    --gba-shadow: #D5D5CD;
    --gba-ink: #313131;
    --gba-ink-soft: #6A6A6A;
    --gba-cursor-red: #E60808;
    --gba-focus-bg: #FFF6CD;
    --gba-focus-bd: #E69441;
    --gba-ring-out: #FF5A20;
    --gba-ring-in: #FFE639;
    --gba-badge-red: #D82048;
    --gba-badge-hi: #FF88A0;
    --gba-hp-green-hi: #73FFAC;
    --gba-hp-green: #5AD583;
    --gba-hp-yel-hi: #FFF68B;
    --gba-hp-yel: #FFE639;
    --gba-hp-red-hi: #FFB47B;
    --gba-hp-red: #DE6A5A;
  }

  * {
    box-sizing: border-box;
  }

  img, .mon-ico32, .mon-ico64, .mon-front-box, .bag-sprite, .pnav-map-wrap {
    image-rendering: pixelated;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #0B1210;
    color: #E6F5EE;
    font-family: 'VT323', monospace;
  }

  body.gallery {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 16px 30px;
    gap: 12px;
    min-height: 100vh;
  }

  body.clean {
    width: 960px;
    height: 544px;
    overflow: hidden;
    background: #000;
  }

  /* Gallery Header (hidden when ?clean=1) */
  .gallery-bar {
    width: 960px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    background: #10201B;
    border: 2px solid #2B5849;
    border-radius: 6px;
    padding: 10px 12px;
  }
  body.clean .gallery-bar,
  body.clean .gallery-notes {
    display: none !important;
  }
  .gallery-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    color: #94F694;
    margin-right: auto;
  }
  .gbtn {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    padding: 7px 10px;
    border-radius: 4px;
    border: 2px solid #2B5849;
    background: #17332A;
    color: #D1FAE5;
    cursor: pointer;
  }
  .gbtn:hover { background: #21493D; }
  .gbtn.on {
    background: linear-gradient(#FDE68A, #E2AB24);
    color: #16271C;
    border-color: #8C6006;
  }
  .gallery-notes {
    width: 960px;
    background: #10201B;
    border: 2px solid #2B5849;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 22px;
    line-height: 26px;
    color: #BEE5D3;
    display: flex;
    justify-content: space-between;
    gap: 16px;
  }

  /* =========================================================================
     STAGE 960x544 (NATIVE PS VITA)
     ========================================================================= */
  .stage {
    position: relative;
    width: 960px;
    height: 544px;
    overflow: hidden;
    background: #000 url('../_assets/fondo_mundo.png') center / 960px 544px no-repeat;
    font-family: 'VT323', monospace;
    font-size: 30px;
    line-height: 1;
    color: var(--gba-ink);
    user-select: none;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.75);
  }
  body.clean .stage { box-shadow: none; }

  /* =========================================================================
     UNIFIED GEN 3 TYPOGRAPHY, SHADOWS & SPRITE HELPERS
     ========================================================================= */
  .ps { font-family: 'VT323', monospace; font-size: 30px; line-height: 1; letter-spacing: 0.5px; text-transform: uppercase; }
  .ps-sm { font-family: 'VT323', monospace; font-size: 27px; line-height: 1; letter-spacing: 0.4px; text-transform: uppercase; }
  .ps-xs { font-family: 'VT323', monospace; font-size: 24px; line-height: 1; letter-spacing: 0.3px; text-transform: uppercase; }
  .ps-2xs { font-family: 'VT323', monospace; font-size: 21px; line-height: 1; letter-spacing: 0.2px; text-transform: uppercase; }

  .gba-txt { text-shadow: 2px 2px 0 var(--gba-shadow); }
  .gba-txt-dark { text-shadow: 2px 2px 0 var(--gba-outline); }

  /* Crisp Red Selection Arrow ▶ */
  .cursor {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    color: var(--gba-cursor-red);
    text-shadow: 2px 2px 0 var(--gba-shadow);
    font-size: 20px;
    line-height: 1;
    flex: none;
  }

  /* Pokemon Icon Sheets (32x64 frame 0) & Front Sprite Frames (crop top frame) */
  .mon-ico32 {
    width: 32px;
    height: 32px;
    background-size: 32px 64px;
    background-position: 0 0;
    background-repeat: no-repeat;
    flex: none;
  }
  .mon-ico64 {
    width: 64px;
    height: 64px;
    background-size: 64px 128px;
    background-position: 0 0;
    background-repeat: no-repeat;
    flex: none;
  }
  .mon-front {
    object-fit: cover;
    object-position: top;
    flex: none;
  }
  .mon-front-box {
    background-size: 100% auto;
    background-position: 0 0;
    background-repeat: no-repeat;
    image-rendering: pixelated;
    flex: none;
  }
  .gba-gender {
    width: 14px;
    height: 14px;
    flex: none;
  }
  .gba-status {
    display: inline-block;
    width: 32px;
    height: 8px;
    background: url('../_assets/ui_gba/status_icons.png') 0 0 / 32px 64px no-repeat;
    zoom: 2;
    flex: none;
  }
  .gba-status.psn { background-position: 0 0; }
  .gba-status.par { background-position: 0 -8px; }
  .gba-status.slp { background-position: 0 -16px; }
  .gba-status.frz { background-position: 0 -24px; }
  .gba-status.brn { background-position: 0 -32px; }

  /* =========================================================================
     CANONICAL GEN 3 WINDOW & MESSAGE CHROME (ALL 7 SCREENS)
     ========================================================================= */

  /* 1. .gba-win: 9-slice stepped GBA window (all framing stays strictly inside box) */
  .gba-win {
    background: #FFFFFF;
    border: 3px solid var(--gba-charcoal);
    border-radius: 6px;
    box-shadow:
      inset 0 0 0 3px var(--gba-mint),
      inset 0 0 0 5px var(--gba-emerald),
      inset 0 0 0 7px var(--gba-charcoal),
      inset 0 0 0 9px var(--gba-shadow),
      0 4px 0 rgba(0, 0, 0, 0.36);
    padding: 13px 15px;
    color: var(--gba-ink);
    position: relative;
  }
  .gba-win.bag-gold {
    background: #FFFDF0;
    box-shadow:
      inset 0 0 0 3px #F8E088,
      inset 0 0 0 5px #D8A838,
      inset 0 0 0 7px var(--gba-charcoal),
      inset 0 0 0 9px #E8DCAC,
      0 4px 0 rgba(0, 0, 0, 0.36);
  }
  .gba-win.battle-lavender {
    background: #FFFFFF;
    box-shadow:
      inset 0 0 0 3px #9094C8,
      inset 0 0 0 5px #525288,
      inset 0 0 0 7px var(--gba-charcoal),
      inset 0 0 0 9px var(--gba-shadow),
      0 4px 0 rgba(0, 0, 0, 0.36);
  }
  .gba-win.dark-well {
    background: #223438;
    color: #FFFFFF;
    box-shadow:
      inset 0 0 0 3px var(--gba-mint),
      inset 0 0 0 5px #175E47,
      inset 0 0 0 7px #141A1C,
      0 4px 0 rgba(0, 0, 0, 0.38);
  }

  /* 2. .gba-msg: Canonical Emerald message_box.png with thick vertical double-rail caps */
  .gba-msg {
    position: relative;
    background: #FFFFFF;
    border: 3px solid var(--gba-charcoal);
    border-radius: 6px;
    box-shadow:
      inset 0 3px 0 var(--gba-msg-mint),
      inset 0 -3px 0 var(--gba-msg-teal),
      inset 0 5px 0 var(--gba-charcoal),
      inset 0 -5px 0 var(--gba-charcoal),
      inset 0 8px 0 var(--gba-shadow),
      0 4px 0 rgba(0, 0, 0, 0.38);
    padding: 12px 30px;
    color: var(--gba-ink);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .gba-msg::before,
  .gba-msg::after {
    content: '';
    position: absolute;
    top: 3px;
    bottom: 3px;
    width: 14px;
    pointer-events: none;
  }
  .gba-msg::before {
    left: 2px;
    background: linear-gradient(90deg, var(--gba-msg-mint) 0 46%, var(--gba-msg-teal) 46% 100%);
    border-right: 2px solid var(--gba-charcoal);
    border-radius: 2px 0 0 2px;
  }
  .gba-msg::after {
    right: 2px;
    background: linear-gradient(90deg, var(--gba-msg-teal) 0 54%, var(--gba-msg-mint) 54% 100%);
    border-left: 2px solid var(--gba-charcoal);
    border-radius: 0 2px 2px 0;
  }

  /* Battle variant of .gba-msg (textbox.png: dark slate paper + coral/steel caps) */
  .gba-msg.battle-dark {
    background: #293941;
    color: #FFFFFF;
    border-color: #141A1C;
    box-shadow:
      inset 0 3px 0 #FFA462,
      inset 0 -3px 0 #DC5A41,
      inset 0 5px 0 #141A1C,
      inset 0 -5px 0 #141A1C,
      inset 0 7px 0 #5C7280,
      0 4px 0 rgba(0, 0, 0, 0.38);
  }
  .gba-msg.battle-dark::before {
    background: linear-gradient(90deg, #DC5A41 0 46%, #FFA462 46% 100%);
    border-right: 2px solid #D8E4EC;
  }
  .gba-msg.battle-dark::after {
    background: linear-gradient(90deg, #FFA462 0 54%, #DC5A41 54% 100%);
    border-left: 2px solid #D8E4EC;
  }

  .msg-next {
    margin-left: auto;
    align-self: flex-end;
    color: var(--gba-cursor-red);
    text-shadow: 2px 2px 0 var(--gba-shadow);
    font-size: 16px;
    line-height: 1;
    flex: none;
  }

  /* 3. .gba-section-strip: Beveled Summary-Screen colored title ribbon */
  .gba-section-strip {
    height: 30px;
    background: #354247;
    border: 2px solid var(--gba-charcoal);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-right: 10px;
    overflow: hidden;
    flex: none;
  }
  .gba-section-tag {
    position: relative;
    height: 100%;
    padding: 0 20px 0 16px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'VT323', monospace;
    font-size: 27px;
    letter-spacing: 0.5px;
    color: #FFFFFF;
    text-shadow: 2px 2px 0 #182020;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 100%, 0 100%);
    flex: 0 1 auto;
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .gba-section-tag::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 8px;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,0.38) 0 2px, rgba(0,0,0,0.22) 2px 4px);
  }
  .tag-blue { background: #4888D0; }
  .tag-teal { background: #3E9070; }
  .tag-gold { background: #C89418; }
  .tag-green { background: #4AA840; }
  .tag-magenta { background: #B840A8; }
  .tag-crimson { background: #C82830; }
  .tag-slate { background: #585898; }
  .gba-section-sub {
    font-family: 'VT323', monospace;
    font-size: 24px;
    letter-spacing: 0.4px;
    color: #FFE639;
    text-shadow: 2px 2px 0 #141A1C;
    flex: none;
    white-space: nowrap;
    margin-left: 8px;
  }

  /* =========================================================================
     UNIFIED GEN 3 TOP BAR (.gba-top-bar, 52px) — PARTY, BAG, SUMMARY, POKEDEX
     ========================================================================= */
  .gba-screen-shell {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
  }
  .gba-top-bar {
    height: 52px;
    flex: none;
    padding: 0 12px;
    background: linear-gradient(#2E3B40, #20292D);
    border-bottom: 3px solid var(--gba-outline);
    box-shadow: inset 0 -3px 0 var(--bar-accent, var(--gba-mint));
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
  }
  .gba-sec-pill {
    width: 244px;
    height: 36px;
    padding: 0 10px 0 12px;
    background: var(--pill-bg, #286E5C);
    border: 2px solid var(--gba-outline);
    border-radius: 4px;
    box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.32);
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: #FFFFFF;
    font-family: 'VT323', monospace;
    font-size: 28px;
    letter-spacing: 0.4px;
    text-shadow: 2px 2px 0 #141A1C;
    flex: none;
    white-space: nowrap;
    overflow: hidden;
  }
  .gba-sec-pill > span {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .gba-pager {
    width: 304px;
    height: 36px;
    padding: 0 8px;
    background: #171E21;
    border: 2px solid #0E1315;
    border-radius: 4px;
    box-shadow: inset 0 1px 0 #3E4D52;
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    flex: none;
    white-space: nowrap;
    overflow: hidden;
  }
  .gba-lr {
    height: 24px;
    min-width: 26px;
    padding: 0 7px;
    background: #404C54;
    border: 1px solid #0E1315;
    box-shadow: inset 1px 1px 0 #70808C;
    border-radius: 2px;
    font-family: 'VT323', monospace;
    font-size: 22px;
    color: #FFE639;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .gba-dots {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .gba-dots i {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #3A464C;
    border: 2px solid #101518;
    display: inline-block;
  }
  .gba-dots i.on {
    background: #FFFFFF;
    border-color: #FFE639;
    box-shadow: 0 0 0 1px #101518;
  }
  .gba-dots i.filled {
    background: #5AD583;
    border-color: #101518;
  }
  .gba-pager-txt {
    font-family: 'VT323', monospace;
    font-size: 25px;
    letter-spacing: 0.4px;
    color: #E6F4F0;
    text-shadow: 1px 1px 0 #000;
    white-space: nowrap;
  }

  /* Crimson-Magenta Gen 3 Help Bar Control Badges (Bag/Pokedex tiles reference) */
  .gba-help-row {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    flex: none;
  }
  .gba-hkey {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
    font-family: 'VT323', monospace;
    font-size: 24px;
    color: #FFFFFF;
    text-shadow: 2px 2px 0 #101518;
  }
  .gba-key-cap {
    min-width: 24px;
    height: 24px;
    padding: 0 6px;
    border-radius: 3px;
    background: linear-gradient(#E8204C, #B81034);
    border: 2px solid #101518;
    box-shadow: inset 1px 1px 0 #FF88A4;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'VT323', monospace;
    font-size: 19px;
    color: #FFFFFF;
    text-shadow: 1px 1px 0 #480010;
  }
  .gba-key-cap.gold {
    background: linear-gradient(#F0B828, #C48810);
    box-shadow: inset 1px 1px 0 #FFF4A0;
    color: #182020;
    text-shadow: none;
  }

  /* =========================================================================
     UNIFIED GEN 3 HP BAR & SEGMENTED EXP BAR
     ========================================================================= */
  .gba-hp-wrap {
    display: flex;
    align-items: center;
    background: #394040;
    border: 2px solid #182020;
    border-radius: 4px;
    padding: 2px 3px;
    gap: 4px;
  }
  .gba-hp-tag {
    font-family: 'VT323', monospace;
    font-size: 16px;
    line-height: 11px;
    letter-spacing: 0.4px;
    color: #FFE600;
    background: #242A2A;
    padding: 1px 5px;
    border-radius: 2px;
    flex: none;
  }
  .gba-hp-track {
    flex: 1;
    height: 9px;
    background: #203900;
    border: 1px solid #182020;
    border-radius: 2px;
    overflow: hidden;
  }
  .gba-hp-fill {
    height: 100%;
    background: linear-gradient(#73FFAC 0 42%, #5AD583 42% 100%);
  }
  .gba-hp-fill.mid {
    background: linear-gradient(#FFF68B 0 42%, #FFE639 42% 100%);
  }
  .gba-hp-fill.low {
    background: linear-gradient(#FFB47B 0 42%, #DE6A5A 42% 100%);
  }

  .gba-exp-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #3E4452;
    border: 2px solid #182020;
    border-radius: 3px;
    padding: 2px 5px;
  }
  .gba-exp-lbl {
    font-family: 'VT323', monospace;
    font-size: 15px;
    line-height: 1;
    letter-spacing: 0.4px;
    color: #FFE639;
    text-shadow: 1px 1px 0 #141A1C;
    flex: none;
  }
  .gba-exp-track {
    flex: 1;
    height: 7px;
    background: #1C2028;
    border: 1px solid #101418;
    overflow: hidden;
  }
  .gba-exp-track i {
    display: block;
    height: 100%;
    background: repeating-linear-gradient(90deg, #6AE6FF 0 5px, #2488B8 5px 7px);
  }

  /* =========================================================================
     UNIFIED GEN 3 TILED BACKGROUNDS (8px / 16px HORIZONTAL STRIPES + TILE GRID)
     ========================================================================= */
  .theme-party {
    --bar-accent: #73CDA4;
    --pill-bg: #2B7A6B;
    background-color: rgba(43, 107, 100, 0.60);
    background-image:
      repeating-linear-gradient(180deg, rgba(115, 205, 164, 0.14) 0 4px, rgba(0, 0, 0, 0.12) 4px 8px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
      linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    background-size: auto, 16px 16px, 16px 16px;
  }
  .theme-bag {
    --bar-accent: #5CB4D0;
    --pill-bg: #2C6A88;
    background-color: rgba(40, 91, 117, 0.60);
    background-image:
      repeating-linear-gradient(180deg, rgba(130, 200, 230, 0.14) 0 4px, rgba(0, 0, 0, 0.14) 4px 8px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
      linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    background-size: auto, 16px 16px, 16px 16px;
  }
  .theme-summary {
    --bar-accent: #A494DE;
    --pill-bg: #6452A4;
    background-color: rgba(84, 70, 134, 0.60);
    background-image:
      repeating-linear-gradient(180deg, rgba(200, 185, 255, 0.12) 0 4px, rgba(0, 0, 0, 0.14) 4px 8px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
      linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
    background-size: auto, 16px 16px, 16px 16px;
  }
  .theme-pokedex {
    --bar-accent: #30D048;
    --pill-bg: #F8F8F8;
    background-color: rgba(24, 128, 32, 0.60);
    background-image:
      repeating-linear-gradient(180deg, rgba(40, 184, 56, 0.18) 0 4px, rgba(0, 0, 0, 0.14) 4px 8px);
  }
  .theme-pokedex .gba-sec-pill {
    background: #F8F8F8;
    color: #182020;
    text-shadow: 2px 2px 0 #C8C8C8;
    border: 2px solid #182020;
  }
  .gba-win .gba-hkey,
  .gba-msg .gba-hkey {
    color: var(--gba-ink);
    text-shadow: 2px 2px 0 var(--gba-shadow);
  }

  /* =========================================================================
     SCREEN 1: HUB (OVERWORLD + WOOD SIGN + MINI PARTY + START + .gba-msg)
     ========================================================================= */
  .stage-hub {
    position: absolute;
    inset: 0;
    background: url('../_assets/fondo_mundo.png') center / 960px 544px no-repeat;
  }

  .hub-left-col {
    position: absolute;
    left: 14px;
    top: 14px;
    bottom: 116px;
    width: 438px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .hub-sign {
    width: 100%;
    border: 3px solid var(--gba-charcoal);
    border-radius: 5px;
    box-shadow: inset 0 0 0 2px #B47B41, 0 4px 0 rgba(0, 0, 0, 0.42);
    overflow: hidden;
  }
  .hub-sign-top {
    position: relative;
    background: linear-gradient(#2C8668, #175E47);
    border-bottom: 3px solid var(--gba-charcoal);
    padding: 7px 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #FFFFFF;
    text-shadow: 2px 2px 0 #0C3226;
    text-align: center;
  }
  .hub-sign-top > img {
    position: absolute;
    left: 12px;
  }
  .hub-sign-body {

  /* -------------------------------------------------------------------------

    const tabIdx = Math.max(0, TABS.indexOf(state.sumTab));

    const t = TABS[tabIdx];

    const top = topBar({
      pillHtml: `<img src="../_assets/balls/poke.png" alt=""><span>POKéMON SUMMARY</span>`,
      centerHtml: `
        <span class="gba-lr" data-lr="-1">L</span>
        <span class="gba-dots">${TABS.map((_, i) => `<i class="${i === tabIdx ? 'on' : ''}" data-dot="${i}"></i>`).join('')}</span>
        <span class="gba-pager-txt">${tabTitle}</span>
        <span class="gba-lr" data-lr="1">R</span>
      `,
      helpHtml:
        hkey('▲▼', 'MON', false, 'data-sum-cycle="1"') +
        hkey('◄►', 'PAGE', false, 'data-lr="1"') +
        hkey('○', 'BACK', true, 'data-back="party"'),
    });

    let rightHtml = '';

              <div class="stat-row">
                <span class="ps-xs" style="color:${col}">${lbl}</span>
                <span class="ps-xs" style="text-align:right;white-space:nowrap">${s[1]}</span>
                <div class="sbar"><i style="width:${s[2]}%"></i></div>
                <span class="eviv-pill">EV ${s[3]}</span>
                <span class="eviv-pill">IV ${s[4]}</span>

        <div class="sum-mid-pair">

          <div class="sum-sub-box">

              <span class="gba-section-tag tag-teal">ABILITY</span>

        <div class="sum-moves-4">
          ${m.moves.map(mv => `
            <div class="smv-pill">
              <img src="../_assets/types/${mv[1]}.png" style="height:14px;width:28px" alt="">

          ${m.taste}. Loyal Hoenn partner POKéMON.
        </div>
      `;
    } else if (t === 'moves') {
      if (state.sumMv >= m.moves.length) state.sumMv = 0;
      const smv = m.moves[state.sumMv];
      rightHtml = `
        <div class="gba-section-strip">
          <span class="gba-section-tag tag-magenta">BATTLE MOVES</span>
          <span class="gba-section-sub">${m.moves.length} / 4</span>

        <div class="stat-table">
          ${m.moves.map((mv, i) => `
            <div class="stat-row" data-summv="${i}" style="height:54px;grid-template-columns:24px 1fr 80px 96px;background:${i === state.sumMv ? '#FFF6CD' : ''}">

          ${smv[6]}

      `;

          <b>${smv[0]}</b> · APPEAL ${smv[8]} · JAM ${smv[9]}<br>

    return `
      <div class="gba-screen-shell theme-summary">
        ${top}

  function render() {
    const st = document.getElementById('stage');
    if (currentScreen === 'hub') st.innerHTML = renderHub();
    else if (currentScreen === 'party') st.innerHTML = renderParty();
    else if (currentScreen === 'bag') st.innerHTML = renderBag();
    else if (currentScreen === 'summary') st.innerHTML = renderSummary();
    else if (currentScreen === 'battle') st.innerHTML = renderBattle(false);
    else if (currentScreen === 'battle_fight') st.innerHTML = renderBattle(true);
    else if (currentScreen === 'pokedex') st.innerHTML = renderPokedex();
    else if (currentScreen === 'pokenav') st.innerHTML = renderPokenav();
    else if (currentScreen === 'card') st.innerHTML = renderCard();
    else if (currentScreen === 'save') st.innerHTML = renderSave();
    else if (currentScreen === 'options') st.innerHTML = renderOptions();
    else if (currentScreen === 'battle_2v2') st.innerHTML = renderBattle2v2();
    else if (currentScreen === 'target') st.innerHTML = renderTarget();
    else if (currentScreen === 'pokeblocks') st.innerHTML = renderPokeblocks();
    else if (currentScreen === 'ribbons') st.innerHTML = renderRibbons();
    else if (currentScreen === 'pc_boxes') st.innerHTML = renderPcBoxes();
    else if (currentScreen === 'pc_home') st.innerHTML = renderPcHome();
    else if (currentScreen === 'mart') st.innerHTML = renderMart();
    else if (currentScreen === 'dialogs') st.innerHTML = renderDialogs();
    else if (currentScreen === 'extras') st.innerHTML = renderExtras();

    document.querySelectorAll('[data-scr]').forEach(b => b.classList.toggle('on', b.dataset.scr === currentScreen));
    const notes = document.getElementById('galleryNotes');
    if (notes) notes.innerHTML = `<span>${NOTES[currentScreen] || ''}</span><span style="color:#FFE639;white-space:nowrap">960×544 Native Vita</span>`;

    // Hub interactions
    st.querySelectorAll('[data-hub]').forEach(el => el.onclick = () => {
      const idx = +el.dataset.hub;
      const tgt = el.dataset.target;
      if (state.hubIdx === idx && tgt) {
        if (tgt === 'save') state.saveDone = false;
        goScreen(tgt);
      } else {
        state.hubIdx = idx;
        render();
      }
    });
    st.querySelectorAll('[data-hub-mon]').forEach(el => el.onclick = () => {
      state.partyIdx = +el.dataset.hubMon;
      goScreen('party');
    });

    // Party interactions
    st.querySelectorAll('[data-pidx]').forEach(el => el.onclick = () => {
      const idx = +el.dataset.pidx;
      if (currentScreen === 'party' && state.partyIdx === idx) {
        goScreen('summary');
      } else {
        state.partyIdx = idx;
        render();
      }
    });
    st.querySelectorAll('[data-sum-open]').forEach(el => el.onclick = () => goScreen('summary'));
    st.querySelectorAll('[data-sum-open-party]').forEach(el => el.onclick = () => goScreen('party'));
    st.querySelectorAll('[data-bag-open]').forEach(el => el.onclick = () => goScreen('bag'));

    // Summary interactions
    st.querySelectorAll('[data-sum-cycle]').forEach(el => el.onclick = () => {
      state.partyIdx = (state.partyIdx + 1) % PARTY.length;
      render();
    });
    st.querySelectorAll('[data-summv]').forEach(el => el.onclick = () => {
      state.sumMv = +el.dataset.summv;
      render();
    });

    // Bag interactions
    st.querySelectorAll('[data-bag]').forEach(el => el.onclick = () => { state.bagIdx = +el.dataset.bag; render(); });
    st.querySelectorAll('[data-pocket]').forEach(el => el.onclick = () => {
      state.bagPocket = +el.dataset.pocket;
      state.bagIdx = 0;
      render();
    });
    st.querySelectorAll('[data-bag-close]').forEach(el => el.onclick = () => goScreen('hub'));

    // Battle interactions
    st.querySelectorAll('[data-bcmd]').forEach(el => el.onclick = () => {
      const i = +el.dataset.bcmd;
      state.battleCmd = i;
      if (i === 0) goScreen('battle_fight');
      else if (i === 1) goScreen('bag');
      else if (i === 2) goScreen('party');
      else if (i === 3) goScreen('hub');
      else render();
    });
    st.querySelectorAll('[data-bmv]').forEach(el => el.onclick = () => { state.battleMv = +el.dataset.bmv; render(); });
    st.querySelectorAll('[data-battle-back]').forEach(el => el.onclick = () => goScreen('battle'));

    // Pokedex interactions
    st.querySelectorAll('[data-dex]').forEach(el => el.onclick = () => { state.dexIdx = +el.dataset.dex; render(); });
    st.querySelectorAll('[data-dextab]').forEach(el => el.onclick = () => { state.dexTab = +el.dataset.dextab; render(); });
    st.querySelectorAll('[data-cryplay]').forEach(el => el.onclick = () => {
      state.crySeed++;
      state.cryBars = state.cryBars.map((_, k) => 16 + ((state.dexIdx * 23 + state.crySeed * 37 + k * 19 + ((k * k * 13) % 41)) % 82));
      render();
    });

    // PokeNav interactions
    st.querySelectorAll('[data-pnav]').forEach(el => el.onclick = () => { state.pnavTab = +el.dataset.pnav; render(); });
    st.querySelectorAll('[data-pnav-call]').forEach(el => el.onclick = () => { state.pnavCallIdx = +el.dataset.pnavCall; render(); });
    st.querySelectorAll('[data-pnav-fly]').forEach(el => el.onclick = () => { state.pnavFlyIdx = +el.dataset.pnavFly; render(); });
    st.querySelectorAll('[data-pnav-rib]').forEach(el => el.onclick = () => { state.pnavRibIdx = +el.dataset.pnavRib; render(); });

    // Screens 12..20 interactions
    st.querySelectorAll('[data-btgt]').forEach(el => el.onclick = () => {
      if (el.dataset.btgt === 'go_target') { goScreen('target'); return; }
      if (el.dataset.btgt !== '') { state.targetIdx = +el.dataset.btgt; render(); }
    });
    st.querySelectorAll('[data-pblk]').forEach(el => el.onclick = () => { state.blockIdx = +el.dataset.pblk; render(); });
    st.querySelectorAll('[data-ribg]').forEach(el => el.onclick = () => { state.ribGalleryIdx = +el.dataset.ribg; render(); });
    st.querySelectorAll('[data-pcbox]').forEach(el => el.onclick = () => { state.boxIdx = (state.boxIdx + 1) % 6; state.boxSlot = 0; render(); });
    st.querySelectorAll('[data-pcslot]').forEach(el => el.onclick = () => { state.boxSlot = +el.dataset.pcslot; render(); });
    st.querySelectorAll('[data-pchome]').forEach(el => el.onclick = () => {
      const idx = +el.dataset.pchome;
      if (idx === 3) { goScreen('hub'); return; }
      state.pcHomeTab = idx; state.pcHomeIdx = 0; render();
    });
    st.querySelectorAll('[data-pcitem]').forEach(el => el.onclick = () => { state.pcHomeIdx = +el.dataset.pcitem; render(); });
    st.querySelectorAll('[data-mart]').forEach(el => el.onclick = () => { state.martIdx = +el.dataset.mart; render(); });
    st.querySelectorAll('[data-martqty]').forEach(el => el.onclick = () => { state.martQty = Math.max(1, Math.min(99, state.martQty + +el.dataset.martqty)); render(); });
    st.querySelectorAll('[data-zone]').forEach(el => el.onclick = () => { state.zoneIdx = +el.dataset.zone; render(); });
    st.querySelectorAll('[data-extra]').forEach(el => el.onclick = () => { state.extraIdx = +el.dataset.extra; render(); });

    // Trainer Card interactions
    st.querySelectorAll('[data-badge]').forEach(el => el.onclick = () => { state.badgeIdx = +el.dataset.badge; render(); });
    st.querySelectorAll('[data-cardflip]').forEach(el => el.onclick = () => { state.cardTab = state.cardTab ? 0 : 1; render(); });

    // Save interactions
    st.querySelectorAll('[data-save]').forEach(el => el.onclick = () => {
      const wantYes = el.dataset.save === 'yes';
      if (wantYes) {
        if (state.saveYes) {
          state.saveDone = true;
        } else {
          state.saveYes = true;
          state.saveDone = false;
        }
        render();
      } else {
        if (!state.saveYes) {
          state.saveDone = false;
          goScreen('hub');
        } else {
          state.saveYes = false;
          render();
        }
      }
    });

    // Options interactions
    st.querySelectorAll('[data-optval]').forEach(el => el.onclick = e => {
      e.stopPropagation();
      const ri = +el.dataset.opt;
      const vi = +el.dataset.optval;
      state.optIdx = ri;
      optValues[state.optTab][ri] = vi;
      render();
    });
    st.querySelectorAll('[data-opt]').forEach(el => el.onclick = () => {
      if (el.hasAttribute('data-optval')) return;
      state.optIdx = +el.dataset.opt;
      render();
    });

    // Shared L / R, dot indicators & back button navigation
    st.querySelectorAll('[data-lr]').forEach(el => el.onclick = () => {
      const dir = +el.dataset.lr;
      if (currentScreen === 'party') {
        state.partyIdx = (state.partyIdx + dir + PARTY.length) % PARTY.length;
      } else if (currentScreen === 'bag') {
        state.bagPocket = (state.bagPocket + dir + BAG_POCKETS.length) % BAG_POCKETS.length;
        state.bagIdx = 0;
      } else if (currentScreen === 'summary') {
        const T = ['info', 'skills', 'moves', 'contest'];
        const next = (Math.max(0, T.indexOf(state.sumTab)) + dir + T.length) % T.length;
        state.sumTab = T[next];
      } else if (currentScreen === 'pokedex') {
        state.dexTab = (state.dexTab + dir + 4) % 4;
      } else if (currentScreen === 'pokenav') {
        state.pnavTab = (state.pnavTab + dir + 4) % 4;
      } else if (currentScreen === 'card') {
        if (el.closest('.gba-help-row')) state.badgeIdx = (state.badgeIdx + dir + 8) % 8;
        else state.cardTab = (state.cardTab + dir + 2) % 2;
      } else if (currentScreen === 'options') {
        state.optTab = (state.optTab + dir + OPT_TABS.length) % OPT_TABS.length;
        state.optIdx = 0;
      } else if (currentScreen === 'pokeblocks') {
        state.blockIdx = (state.blockIdx + dir + 6) % 6;
      } else if (currentScreen === 'ribbons') {
        state.ribGalleryIdx = (state.ribGalleryIdx + dir + 32) % 32;
      } else if (currentScreen === 'pc_boxes') {
        state.boxIdx = (state.boxIdx + dir + 6) % 6;
        state.boxSlot = 0;
      } else if (currentScreen === 'pc_home') {
        state.pcHomeTab = (state.pcHomeTab + dir + 3) % 3;
        state.pcHomeIdx = 0;
      } else if (currentScreen === 'mart') {
        state.martQty = Math.max(1, Math.min(99, state.martQty + dir));
      } else if (currentScreen === 'dialogs') {
        state.zoneIdx = (state.zoneIdx + dir + 6) % 6;
      } else if (currentScreen === 'extras') {
        state.extraIdx = (state.extraIdx + dir + 4) % 4;
      }
      render();
    });
    st.querySelectorAll('[data-dot]').forEach(el => el.onclick = () => {
      const idx = +el.dataset.dot;
      if (currentScreen === 'party') state.partyIdx = idx;
      else if (currentScreen === 'bag') { state.bagPocket = idx; state.bagIdx = 0; }
      else if (currentScreen === 'summary') state.sumTab = ['info', 'skills', 'moves', 'contest'][idx] || 'skills';
      else if (currentScreen === 'pokenav') state.pnavTab = idx;
      else if (currentScreen === 'card') state.cardTab = idx;
      else if (currentScreen === 'options') { state.optTab = idx; state.optIdx = 0; }
      else if (currentScreen === 'pokeblocks') state.blockIdx = idx;
      else if (currentScreen === 'pc_boxes') { state.boxIdx = idx; state.boxSlot = 0; }
      else if (currentScreen === 'pc_home') { state.pcHomeTab = idx; state.pcHomeIdx = 0; }
      else if (currentScreen === 'extras') state.extraIdx = idx;
      render();
    });
    st.querySelectorAll('[data-back]').forEach(el => el.onclick = () => goScreen(el.dataset.back));
  }

  document.querySelectorAll('[data-scr]').forEach(b => {
    b.onclick = () => {
      if (b.dataset.scr === 'save') state.saveDone = false;
      goScreen(b.dataset.scr);
    };
  });

  const ORDER = [
    'hub', 'party', 'bag', 'summary', 'battle', 'battle_fight', 'pokedex',
    'pokenav', 'card', 'save', 'options', 'battle_2v2', 'target', 'pokeblocks',
    'ribbons', 'pc_boxes', 'pc_home', 'mart', 'dialogs', 'extras',
  ];
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') {
      goScreen(ORDER[(ORDER.indexOf(currentScreen) + 1) % ORDER.length]);
    } else if (e.key === 'ArrowLeft') {
      goScreen(ORDER[(ORDER.indexOf(currentScreen) - 1 + ORDER.length) % ORDER.length]);
    } else if (e.key >= '1' && e.key <= '9') {
      goScreen(ORDER[+e.key - 1]);
    } else if (e.key === '0') {
      goScreen(ORDER[9]);
    } else if (e.key === '-') {
      goScreen(ORDER[10]);
    }
  });

  render();
})();
</script>
</body>
</html>
