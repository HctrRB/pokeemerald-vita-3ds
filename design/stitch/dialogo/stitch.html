            </div>
<div class="font-headline-md text-headline-sm text-slate-black tracking-wide font-bold antialiased leading-relaxed drop-shadow-[0_1px_0_rgba(255,255,255,0.7)] flex items-center gap-2" id="dialogue-line-2" style="font-family: &quot;Press Start 2P&quot;, monospace; font-size: 12px; line-height: 22px; letter-spacing: 0.02em; -webkit-font-smoothing: none; text-rendering: geometricprecision;">
<span class="">PROF. BIRCH next door.</span>
<span class="inline-block w-2.5 h-4 bg-emerald-sage/60 animate-pulse ml-1 align-middle rounded-xs"></span>
</div>

</div>

<script>
    // Handheld clock simulation & interactive advance micro-state
    (function () {
      const clockEl = document.getElementById('vita-clock');
      function updateClock() {
        const now = new Date();
        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        if (clockEl) clockEl.textContent = hours + ':' + minutes + ' ' + ampm;
      }
      updateClock();
      setInterval(updateClock, 30000);

      // Micro dialog toggle simulation on advance
      const advanceBtn = document.getElementById('btn-advance');
      const l1 = document.getElementById('dialogue-line-1');
      const l2 = document.getElementById('dialogue-line-2');
      let step = 0;

      const dialogues = [
        {
          l1: "BRENDAN! Before you go, say hi to",
          l2: "PROF. BIRCH next door."
        },
        {
          l1: "He was looking for you earlier.",
          l2: "Take care out in the tall grass!"
        }
      ];

      if (advanceBtn && l1 && l2) {
        advanceBtn.addEventListener('click', function () {
          step = (step + 1) % dialogues.length;
          l1.textContent = dialogues[step].l1;
          l2.innerHTML = dialogues[step].l2 + ' <span class="inline-block w-2.5 h-4 bg-emerald-sage/60 animate-pulse ml-1 align-middle rounded-xs"></span>';
        });
      }

      // Auto button feedback
      const autoBtn = document.getElementById('btn-auto');
      let autoActive = false;
      if (autoBtn) {
        autoBtn.addEventListener('click', function () {
          autoActive = !autoActive;
          autoBtn.classList.toggle('bg-emerald-sage', autoActive);
          autoBtn.classList.toggle('text-on-primary', autoActive);
        });
      }
    })();
  </script>
