<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Naming screen</title>
<link rel="stylesheet" href="../_shared/ui.css">
<style>
  /* Naming screen (naming_screen.c). Who is named on the left, the name with its slots on top,
     the keyboard below. Review: ?for=mon (nickname, 10), player (7), box (8 = box name from the
     PC box menu). The tabs are the GBA's three pages; L / R change them (the GBA's SELECT, not
     repeated here). ○ deletes the last letter and never leaves: the only way out is OK (or
     START, which jumps to OK). OK with an empty name keeps the default name (species, BOX n),
     as the game does; for the player it is refused until one letter is typed. */
  .who { width: 228px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .who .pic { width: 160px; height: 160px; }
  .who .pic img { zoom: 2; }
  .main { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .name { display: flex; align-items: center; gap: 6px; padding: 10px 16px; }
  .name .slot { width: 34px; height: 44px; display: flex; align-items: flex-end; justify-content: center; border-bottom: 3px solid var(--paper-shade); font-size: 40px; line-height: 40px; }
  .name .slot.cur { border-bottom-color: var(--sel-edge); }
  .keys { flex: 1; display: grid; grid-template-columns: repeat(9, 1fr) 132px; grid-template-rows: repeat(4, 1fr); gap: 6px; padding: 12px; }
  .k { display: flex; align-items: center; justify-content: center; border-radius: 4px; cursor: pointer; font-size: 32px;
    background: var(--paper-1); border: 2px solid var(--row-line); box-shadow: inset 0 -3px 0 var(--paper-shade); }
  .k.on { background: linear-gradient(var(--sel-top), var(--sel-bot)); border-color: var(--sel-edge); color: var(--sel-ink); box-shadow: inset 0 -3px 0 var(--sel-edge); }
  .k.fn { font-family: 'Press Start 2P', monospace; font-size: 16px; color: #fff; border-color: #172A22; box-shadow: inset 1px 1px 0 rgba(255,255,255,0.4), inset 0 -3px 0 rgba(0,0,0,0.3); }
  .k.back { background: linear-gradient(#A83A3A, #7A2626); } .k.ok { background: linear-gradient(#2F7A5C, #1D5A43); } .k.space { background: linear-gradient(#5E6E64, #3E4A43); }
  .k.fn.on { box-shadow: 0 0 0 3px var(--sel-bot), inset 0 -3px 0 rgba(0,0,0,0.3); }
</style>
</head>
<body data-screen="teclado_nombre">
<div class="stage">
  <div class="frame">
    <div class="header" data-nav="naming:upper"><span class="spacer"></span><span class="capsule" id="len">4 / 10</span></div>
    <div class="body">
      <div class="panel who">
        <div class="ps" style="align-self:flex-start" id="whohead">NICKNAME</div>
        <div class="well pic" id="whopic"><img src="../_assets/pokemon/mudkip_front.png" alt=""></div>
        <div class="vt-lg" id="whoq">MUDKIP's nickname?</div>
        <div class="vt-sm soft" id="whodef" style="line-height:26px">Empty: stays MUDKIP</div>
      </div>
      <div class="main">
        <div class="panel name" id="name"></div>
        <div class="panel keys" id="keys"></div>
      </div>
    </div>
    <div class="footer">
      <span class="btn" data-btn="cross"><span class="glyph cross">✕</span>Type</span>
      <span class="btn" data-btn="circle"><span class="glyph circle">○</span>Delete</span>
      <span class="btn" data-btn="start"><span class="key">START</span>Go to OK</span>
      <span class="spacer"></span>
    </div>
  </div>
</div>
<script src="../_shared/data.js"></script>
<script src="../_shared/nav.js"></script>
<script src="../_shared/screens.js"></script>
<script>
(() => {
  const PAGES = {
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', lower: 'abcdefghijklmnopqrstuvwxyz',
    others: '0123456789!?♂♀/-…“”‘’.,:',
  };
  const FOR = {
    mon: { head: 'NICKNAME', q: "MUDKIP's nickname?", def: 'MUDKIP', max: 10, pic: '<img src="../_assets/pokemon/mudkip_front.png" alt="">', name: 'MUDS' },
    player: { head: 'YOUR NAME', q: "Your name?", def: '', max: 7, pic: '<img src="../_assets/trainers/brendan.png" alt="">', name: '' },
    box: { head: 'BOX NAME', q: "BOX 1's name?", def: 'BOX 1', max: 8, pic: '<img src="../_assets/start/pokenav.png" alt="" style="zoom:3">', name: 'BOX 1' },
  };
  const f = FOR[new URLSearchParams(location.search).get('for')] || FOR.mon;
  let name = f.name, page = 'upper';
  const toast = t => window.UI && UI.toast(t);
  document.getElementById('whohead').textContent = f.head;
  document.getElementById('whoq').textContent = f.q;
  document.getElementById('whopic').innerHTML = f.pic;
  document.getElementById('whodef').textContent = f.def ? 'Empty: stays ' + f.def : 'Type at least one letter';
  function paintName() {
    const el = document.getElementById('name'); el.innerHTML = '';
    for (let i = 0; i < f.max; i++) el.insertAdjacentHTML('beforeend', `<span class="slot${i === name.length ? ' cur' : ''}">${name[i] || ''}</span>`);
    document.getElementById('len').textContent = name.length + ' / ' + f.max;
  }
  function paintKeys() {
    const chars = [...PAGES[page]];
    const k = document.getElementById('keys'); k.innerHTML = '';
    // 3 rows of 9 characters + 1 row of 9 (padding with blanks), function keys on the right
    const fn = ['<div class="k fn space" data-k=" ">SPACE</div>', '<div class="k fn back" data-k="DEL">DEL</div>', '<div class="k fn ok" data-k="OK" style="grid-row: span 2">OK</div>'];
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 9; c++) { const ch = chars[r * 9 + c]; k.insertAdjacentHTML('beforeend', ch ? `<div class="k" data-k="${ch}">${ch}</div>` : '<div></div>'); }
      if (fn[r]) k.insertAdjacentHTML('beforeend', fn[r]);
    }
    k.querySelector('.k').classList.add('on');
  }
  function del() { if (name.length) { name = name.slice(0, -1); paintName(); } }
  function ok() {
    if (!name.trim() && !f.def) return toast('Type at least one letter.');
    toast('Name: ' + (name.trim() || f.def) + '. Back to where it was opened.');
  }
  document.getElementById('keys').addEventListener('click', e => {
    const el = e.target.closest('[data-k]'); if (!el) return;
    // Touch model of the UI: the first tap selects the key, a tap on the selected key types it
    if (!el.classList.contains('on')) { document.querySelectorAll('#keys .k').forEach(x => x.classList.remove('on')); el.classList.add('on'); return; }
    const v = el.dataset.k;
    if (v === 'DEL') return del();
    if (v === 'OK') return ok();
    if (name.length >= f.max) return;   // full: the cursor jumps to OK in the game
    name += v; paintName();
    if (name.length === f.max) { document.querySelectorAll('#keys .k').forEach(x => x.classList.remove('on')); document.querySelector('[data-k="OK"]').classList.add('on'); }
  });
  document.addEventListener('ui-tab', e => { page = e.detail; paintKeys(); });
  document.addEventListener('ui-back', del);
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    document.querySelectorAll('#keys .k').forEach(x => x.classList.remove('on'));
    document.querySelector('[data-k="OK"]').classList.add('on');
  });
  paintName(); paintKeys();
})();
</script>
</body>
</html>
