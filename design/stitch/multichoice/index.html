<body data-screen="multichoice">
<!-- Mirror of a script multichoice (MULTI_BUY_SELL_QUIT) with the money box. -->

  <div class="capsule" style="position:absolute; right:48px; top:16px;">MONEY <span class="money">₽ 3,000</span></div>

    <div class="row">SELL</div>
    <div class="row">SEE YA!</div>
  </div>
  <div class="dialog">
    <div class="name ps">CLERK</div>
    Hi, there! May I help you?
  </div>
</div>
