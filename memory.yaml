# Long-lived decisions and constraints. Keep entries short and only for things that are not
# obvious from the code. Full history until 2026-11-05: docs/history/memory_2026-11-05.yaml.

project:
  name: pokeemerald-vita-3ds
  target: PS Vita (Cortex-A9 x3 user cores, PowerVR SGX543MP4+, 512 MB RAM)
  toolchain: VitaSDK 2026.08 in MSYS2, CMake, vitaGL
  branch: main (published on GitHub at HctrRB/pokeemerald-vita-3ds; history squashed on 2026-11-05)
  language: English for code, comments and every document (decided 2026-11-05, confirmed
    2026-11-19). The players' build guide is also kept in Spanish (BUILD_YOUR_OWN in two
    languages, both changed in the same commit); docs/history keeps its original language.

licensing:
  - Files derived from Emerald 3DS (ZallaxDev/emerald-3ds v0.5.0) are CC BY-NC-SA 4.0; MIT covers
    only the multiplatform layer and original Vita code. See NOTICE.md.
  - Reference checkout of Emerald 3DS: C:\Users\hrast\Projects\emerald-3ds (bcae4b7).

gpu_and_threads:
  - Never change the affinity of SDK threads (SceGxmDisplayQueue, vitaGL, audio). Moving the GXM
    display queue off Core 0 crashed the GPU.
  - Dynamic geometry streams from client arrays; static chunk geometry uses one GL buffer per
    chunk slot filled once at build time. A per-frame vglBufferData path crashed the GPU.
  - Chunk worker (Core 2) is protected by a window, not locks: every voxel module reads the world
    through globals and fills caches on lookups. A job starts after vglSwapBuffers; a 3D frame
    that starts while it runs only does work that touches none of its state and calls
    EnsureWorkerIdle() before anything that would. New Core 0 voxel code must do the same
    (docs/reference/THREADS.md, "The chunk worker").
  - Core 1 (AgbMain) is the master clock at 60.00 Hz, paced on the audio queue. In 3D, Core 0
    renders once per game frame (twice per frame at 30 FPS, the default) by waiting on
    sFrameReadySem; its own 60 Hz timer drifted and repeated/skipped game frames. Core 0 never
    writes game state.
  - The game runs on Core 1 alone (decided 2026-11-19, after the Pacifidlog Bad Eggs: Core 0
    called IsMirageIslandPresent -> GetMonData, which decrypts Pokemon in place). Core 0 / Core 2
    read the game only through the GameFrame (include/platform/game_frame.h) and the two channels
    in tools/core_boundary/allow.txt; the build fails otherwise (check_core_boundary.py on the
    linked ELF). Code ported from Emerald 3DS (single-threaded) must be split into a Core 1
    capture and a Core 0 reader, never called from the renderer as it is.
  - The map loader calls GameFrame_BeginMapMutation (sets sMapMutationLock, starts a map epoch);
    publishing the next game frame clears the lock. Core 0 uses the live map grid only while
    GameFrame_MapSettled() (the pinned frame is of that map): without the epoch, the pinned
    frame's old location and the live new grid mixed for one frame. Plan and its outcome:
    docs/history/plans/PLAN_FRONTERA_MULTICORE.md.
  - vitaGL's glTexSubImage2D copies a whole texture drawn in the last 4 swaps: textures rewritten
    at run time use spares or are written in place (docs/reference/RENDERING.md).
  - Animated atlas tiles may only be refreshed from BG VRAM for the active atlas slot (VRAM holds
    only the current map's tileset).
  - Opaque passes keep alpha test and blending off for SGX543 early-Z; fullscreen blended quads
    are avoided.
  - Core 2 `VoxelChunkWorker` processes adaptive 2/4-chunk batches with cooperative abort
    (`sAsyncAbortBatch`), never stalled/duplicated by Core 0 hole builds while busy; `UploadChunkVbo`
    orphans VBOs drawn within `VOXEL_VITAGL_PURGE_FRAMES` so SGX543 never reads overwritten CDRAM.
  - `VoxelWorld_MarkUsedMetatiles` caches static per-`layoutId` metatile masks in a 32-entry LRU
    (~34 KB BSS) so zone crossings merge in <1 ms instead of rescanning 40,000 tiles.
  - 3D Fly cinematic (`voxel_fly.c/.h` CC BY-NC-SA 4.0 from emerald-3ds `8bba417`, Core 1/Core 0
    triple-buffered bridge in `voxel_fly_game.c/.h`) animates layered clouds at ~1 ms/frame in
    `VOXEL_FLY_CLOUD` while Core 2 streams aerial destination chunks; `SoftReset` calls `VoxelFlyGame_OnReset`.

storage:
  app_assets: app0:voxel/, app0:ui/, app0:ui2/, app0:followers/followers.pak (PKF1 container)
  user_data: ux0:data/POKEVITA/ (saves/, pokeemerald.cfg, settings.txt; thread_violations.log only
    on a violation; debug.log, perf_* and ui_stall.log only in VITA_LOGGING / VITA_TELEMETRY builds)
  notes:
    - Logging to the memory card can stall for hundreds of ms: never log per frame.

widescreen:
  - widescreen.c makes GBA screens panoramic (288-px lines) and is always on (Widescreen_IsOn).
    The "Wide Scene" design (docs/history/plans/ANALISIS_WIDESCREEN.md) recycled Emerald 3DS's scene
    classification and margin policies, not its GPU compositor; what is left is listed in
    docs/reference/SCENES_16_9.md, "Not done".

menus:
  - The GBA menus and the GBA overlay over 3D were replaced by the native touch UI in
    src/platform/ui/ rather than optimising GBA menu code (decision of 2026-11-05).

new_ui:
  - Only active UI: src/platform/ui/ is always enabled when app0:ui2/ui_atlas.bin loads; the old
    3DS-style Vita UI (vita_ui*.c, vita_battle_hud.c, vita_shop_ui.c, vita_world_ui.c) and the
    ui_v2 toggle were removed on 2026-11-13 (6c481fd).
  - Single 1024x2048 RGBA8888 texture (UI_TEX_W = 1024, UI_TEX_H = 2048, UI_DYN_Y = 1024), unpacked
    from 16-bit texels (bit 0 = 1: RGB555 opaque; bit 0 = 0, non-zero: white with 8-bit alpha in
    bits 8..1 for antialiased theme fonts): top half (rows 0..1023) loaded from
    app0:ui2/ui_atlas.bin (format v3 UI2A, tools/ui2/build_atlas.py); bottom half (rows 1024..2047,
    256 cells of 64x64) holds runtime-decoded GBA sprites in ui_sprites.c.
  - Type: EMERALD theme uses VT323 32 for body text (28 dropped: unreadable on hardware), VT323 40
    for dialogues, Press Start 2P 16 for footers/labels and zone sign motto, and 24 for large titles;
    the other themes bake their own four font roles via tools/ui2/bake_theme_fonts.py.
  - Three screen-opening modes in ui_core.c: normal field overlay (Open, freezes field via
    LockPlayerFieldControls), script-driven (UiCore_OpenFromScript, script task keeps waiting for
    !Ui_IsOpen()), and full-screen hosted replacement (UiCore_OpenHosted / CB2_UiHost, keeps GBA
    sprites/tasks running and runs scene resets before opening).
  - Game windows are mirrored, not rewritten (ui_mirror.c): Core 1 reads TextPrinter and menu
    state (gUiPrinterStart, gUiDialogFrameShown, gUiChoice*, GetMoneyBoxWindowForUi) plus window 0
    in 2D evolution, egg-hatch and trade scenes (EvolutionScene_IsActiveForUi, EggHatch_IsActiveForUi,
    Trade_IsAnimActiveForUi) over an opaque bottom band; pass 6 skips the field GBA frame while
    every BG0 window has a mirror (Ui_MirrorCovers). Page breaks / scrolls apply when the next
    character prints (the game consumes them before waiting for A).
  - In the player's PC (ui_scr_playerpc.c), DECORATE and PUT AWAY hand control to GBA field tasks
    and UiPlayerPc_ReenterFromField reopens the tab on return.
  - Every menu opens on its first tab; circle held 1 s closes the whole UI.
  - Menu themes: OPTIONS > GENERAL > DISPLAY > MENU COLOR (extra "ui_theme", ui_theme.c): GBA
    (default, antialiased VT323, Gen 3 framing via gbaFrame),
    RED (Saira Condensed), EMERALD (Press Start 2P / VT323), CRYSTAL (M PLUS Rounded 1c),
    TROPICAL (Fredoka), ROYAL (Exo 2). Applied across every menu screen, the battle HUD
    (ui_battle_hud.c via UiW_ThemeBox), and zone signs (ui_sign.c); design/stitch mocks support ?theme=.

ext_palettes:
  - 16 extended overworld sprite palettes live behind the 32 GBA palettes (`gPlttBufferUnfaded/Faded`
    sized `PLTT_BUFFER_ALLOC = 512 + 256`, `PLTT_BUFFER_SIZE` kept at 512 for non-field uses).
  - Instead of widening `selectedPalettes` to 64 bits, ext palettes follow `PLTT_EXT_MODEL`
    (`PALSLOT_NPC_1`, OBJ slot 2) in fades (`palette.c`) and weather (`field_weather.c`).
  - `DrawFrame` latches `gPlttExt` and `gOamExt` once per frame (they only change in VBlank),
    with zero overhead when `gPlttExtInUse == 0`.

soft_reset:
  - `vita-elf-create` drops relocations whose target address equals a segment's `p_vaddr + p_memsz`
    (`addr < p_vaddr + p_memsz`). Because `gamebss` is the last section in the RW segment,
    `vita_reset.c` keeps a 4-byte sentinel in `.noinit` (placed after `gamebss`) so `__stop_gamebss`
    is strictly inside the segment and always relocated in `.sce.rel`.
  - `SoftReset()` (`sdl2.c`) parks Core 0 via `sResetInProgress` / `sCore0PausedForReset` (Core 0 runs
    `VoxelRenderer_OnReset()` -> `ChunkWorker_Join()` to idle Core 2 and invalidate chunk/entity caches)
    before Core 1 calls `Ui_OnReset()` and `VitaReset_RestoreBootSnapshot()`.
  - `rfu_REQ_stopMode()` / `rfu_waitREQComplete()` in `AgbMain` and `link.c` are guarded by
    `#ifndef PORTABLE` because `InitRFU()` is skipped on portable builds (`gSTWIStatus == NULL`).

battle_memory_invariants:
  - `gBattleMoves[MOVES_COUNT]` is mutable in `.bss` (`src/platform/mods/mod_manager.c`) near the
    end of `seg2`. Unlike GBA ROM (no MMU), indexing `gBattleMoves[MOVE_UNAVAILABLE]` (`0xFFFF`,
    offset `+0x8FFF7`) lands in unmapped memory and triggers an immediate ARM Data Abort
    (`C2-12828-1`). Any AI, battle-util, or UI code reading `gLastMoves[]`, `gLastLandedMoves[]`,
    `BATTLE_HISTORY->usedMoves[]`, `gChosenMove`, or `gCurrentMove` must sanitize/validate
    `< MOVES_COUNT` before indexing `gBattleMoves[]` or `gMoveCategories[]`.

documentation:
  - Decided 2026-11-19, after a code-based audit found the reference docs stale while their links
    still resolved (study: docs/plan/DOCS_AND_STATE_STUDY.md).
  - Organised by type. Front page at the root; docs/guides and docs/reference (public);
    docs/plan (living plans only), docs/reports, docs/proposals and docs/history (private, kept
    out of the public snapshot). docs/reference is the only technical source of truth.
  - Reference docs cite symbols and constant names, never line numbers or copied values; every doc
    under docs/ starts with "Type · Audience · Status" and "Verified against: <commit>"; a commit
    that changes documented behaviour updates its reference doc in the same commit.
  - This file is the record of decisions; an entry that needs more detail links to the document
    that explains it, in that document's own folder (no separate decisions folder).
  - CONTRIBUTING rules relaxed: a file header only for new or rewritten files; no mandatory
    @brief, a comment where a function's thread, ownership or side effects are not obvious.
  - The documentation check fails the build on docs/reference and docs/guides and only warns
    on plans, reports, proposals and history.
